            - meanThen
            - meanNow
            - meanDrop
          properties:
            pairs:
              type: integer
              minimum: 0
              maximum: 1000000000
              description: 至少复盘过一次的事件数
            meanThen:
              type: number
              minimum: 0
              maximum: 10
              description: 这些事件当时强度的平均值
              nullable: true
            meanNow:
              type: number
              minimum: 0
              maximum: 10
              description: 这些事件最近一次复盘强度的平均值
              nullable: true
            meanDrop:
              type: number
              minimum: -10
              maximum: 10
              description: meanThen − meanNow
              nullable: true
        letGo:
          type: object
          additionalProperties: false
          required:
            - count
            - medianDays
          properties:
            count:
              type: integer
              minimum: 0
              maximum: 1000000000
            medianDays:
              type: number
              minimum: 0
              maximum: 100000
              description: 从 happenedOn 到第一次 let_go 的天数中位数
              nullable: true
        distributions:
          type: object
          additionalProperties: false
          required:
