components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-nbd_sid
      description: 生产环境的会话 Cookie；本地 COOKIE_SECURE=false 时名为 nbd_sid
  headers:
    XRequestId:
      description: 本次请求的 ID，错误响应体里的 requestId 与它相同
      schema:
        type: string
  parameters:
    XNbdRequest:
      name: X-NBD-Request
      in: header
      required: true
      description: 所有写请求（POST/PUT/PATCH/DELETE）必须带，值固定为 1；缺少时返回 403 REQUEST_HEADER_REQUIRED
      schema:
        type: string
        enum:
          - "1"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选。重试同一次新建时带同一个值，24 小时内不会重复创建；同键不同内容返回 409 IDEMPOTENCY_CONFLICT
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,64}$
    MomentId:
      name: momentId
      in: path
      required: true
      description: 事件 ID
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      description: 补记 ID
      schema:
        type: string
        format: uuid
    ReflectionId:
      name: reflectionId
      in: path
      required: true
      description: 复盘 ID
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      description: 经验 ID
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      description: 标签 ID
      schema:
        type: string
        format: uuid
    KeyId:
      name: keyId
      in: path
      required: true
      description: Agent 密钥 ID
      schema:
        type: string
        format: uuid
    AppId:
      name: appId
      in: path
      required: true
      description: 授权（grant）ID
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 nextCursor，原样传回
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: 每页条数，默认 20，最多 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    From:
      name: from
      in: query
      required: false
      description: LocalDate，按 happenedOn 过滤（含当天）
      schema:
        type: string
        format: date
        description: LocalDate：YYYY-MM-DD，按所有者时区解释
    To:
      name: to
      in: query
      required: false
      description: LocalDate，按 happenedOn 过滤（含当天）
      schema:
        type: string
        format: date
        description: LocalDate：YYYY-MM-DD，按所有者时区解释
  responses:
    BadRequest:
      description: 参数错误
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: 参数不符合要求
              details:
                field: title
            requestId: req-1a2b
    Unauthorized:
      description: 需要登录
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: AUTH_REQUIRED
              message: 请先登录
            requestId: req-1a2b
    Forbidden:
      description: 请求防护或权限失败；NOT_OWNER（登录的不是主人）或 REAUTH_REQUIRED（需要重新验证身份）
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: REQUEST_HEADER_REQUIRED
              message: 写请求缺少 X-NBD-Request 头
            requestId: req-1a2b
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: MOMENT_NOT_FOUND
              message: 这件事不存在或已被彻底删除
            requestId: req-1a2b
    Conflict:
      description: 状态冲突
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: MOMENT_CONFLICT
              message: 这件事刚被修改过，请刷新后再改
              details:
                currentRevision: 3
            requestId: req-1a2b
    PayloadTooLarge:
      description: 请求体过大
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: 内容太长了
            requestId: req-1a2b
    TooManyRequests:
      description: 限流
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: 请求太频繁，请稍后再试
            requestId: req-1a2b
    InternalError:
      description: 服务异常
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务出错了，请带上 requestId 排查
            requestId: req-1a2b
    ServiceUnavailable:
      description: 存储忙或暂不可用
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: STORAGE_BUSY
              message: 服务暂时忙，请稍后重试
            requestId: req-1a2b
  schemas:
    Scene:
      type: string
      enum:
        - work
        - study
        - social
        - family
        - romance
        - online
        - public
        - other
      description: work=工作；study=学习；social=社交；family=家庭；romance=感情；online=网络；public=公共场合；other=其他
    Emotion:
      type: string
      enum:
        - embarrassed
        - ashamed
        - anxious
        - afraid
        - guilty
        - regretful
        - angry
        - aggrieved
        - sad
        - helpless
        - other
      description: embarrassed=尴尬；ashamed=丢脸；anxious=焦虑；afraid=害怕；guilty=内疚；regretful=后悔；angry=生气；aggrieved=委屈；sad=难过；helpless=无力；other=其他
    ThinkingTrap:
      type: string
      enum:
        - spotlight
        - catastrophizing
        - mind_reading
        - fortune_telling
        - overgeneralizing
        - personalizing
        - all_or_nothing
        - should
      description: spotlight=聚光灯效应（以为所有人都在注意自己）；catastrophizing=灾难化（直接想到最坏的结果）；mind_reading=读心术（认定别人一定是这么看我的）；fortune_telling=预言未来（认定坏结果一定会发生）；overgeneralizing=以偏概全（一次出错就当成「我总是这样」）；personalizing=个人化（把不全是自己的责任都揽到身上）；all_or_nothing=非黑即白（不是完美就是彻底失败）；should=应该思维（「我本应该……」式的苛责）
    Resolution:
      type: string
      enum:
        - let_go
        - easing
        - still_matters
      description: let_go=放下了；easing=好多了；still_matters=还在意
    FearCameTrue:
      type: string
      enum:
        - no
        - partly
        - yes
        - unknown
      description: no=没发生；partly=部分发生；yes=发生了；unknown=还不知道
    MomentStatus:
      type: string
      enum:
        - fresh
        - cooling
        - due
        - reflected
        - settled
        - archived
      description: fresh=刚记下；cooling=冷却中；due=该回看；reflected=已回看；settled=已释怀；archived=已归档
    HappenedAtPrecision:
      type: string
      enum:
        - exact
        - day
        - approx
      description: exact=精确时间；day=只知道日期；approx=大概
    Scope:
      type: string
      enum:
        - read
        - write
      description: read=读取历史；write=记录与补记
    ActorKind:
      type: string
      enum:
        - owner
        - agent_key
        - oauth_app
        - system
        - anonymous
      description: owner=我（网页）；agent_key=Agent 密钥；oauth_app=已连接应用；system=系统；anonymous=未登录的访客（如登录失败）
    AuditChannel:
      type: string
      enum:
        - web
        - mcp
        - oauth
        - cli
        - system
      description: web=网页；mcp=MCP；oauth=OAuth；cli=命令行；system=系统任务
    MomentSort:
      type: string
      enum:
        - happened_desc
        - happened_asc
        - captured_desc
        - intensity_desc
      description: happened_desc=发生时间从新到旧；happened_asc=发生时间从旧到新；captured_desc=记录时间从新到旧；intensity_desc=当时强度从高到低
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - requestId
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
              description: 错误码（SCREAMING_SNAKE_CASE），完整列表见 docs/API.md 的错误码表
              pattern: ^[A-Z][A-Z0-9_]*$
            message:
              type: string
              description: 给人看的中文说明，不含堆栈、SQL 或服务器路径
            details:
              type: object
              additionalProperties: true
              description: 部分错误附带的结构化信息，例如 currentRevision、editableUntil
        requestId:
          type: string
          description: 与响应头 X-Request-Id 相同，排障时提供
    Ok:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    Health:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    Ready:
      type: object
      additionalProperties: false
      required:
        - ok
        - schemaVersion
      properties:
        ok:
          type: boolean
          description: 迁移版本与代码一致且数据库可读时为 true
        schemaVersion:
          type: integer
          minimum: 1
          maximum: 100000
    Actor:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - label
      properties:
        kind:
          description: 谁做的
          allOf:
            - $ref: "#/components/schemas/ActorKind"
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Agent 密钥 ID 或 OAuth 授权 ID；owner、system、anonymous 为 null
          nullable: true
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: 展示名，例如「Claude Code（MacBook）」「Claude」「我」
    EnumItem:
      type: object
      additionalProperties: false
      required:
        - key
        - label
      properties:
        key:
          type: string
        label:
          type: string
        hint:
          type: string
          description: 可选的补充说明（思维陷阱有）
    EmotionScore:
      type: object
      additionalProperties: false
      required:
        - key
        - intensity
      properties:
        key:
          $ref: "#/components/schemas/Emotion"
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: 这种情绪单独的强度；没有单独评分时为 null
          nullable: true
    EmotionScoreInput:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          $ref: "#/components/schemas/Emotion"
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: 可选：这种情绪单独的强度
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - timezone
        - weekStartsOn
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 20
        displayName:
          type: string
          minLength: 1
          maxLength: 24
        timezone:
          type: string
          description: IANA 时区，例如 Asia/Shanghai
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
          description: 一周从哪天开始：0=周日，1=周一 … 6=周六
        createdAt:
          type: string
          format: date-time
          description: Instant：UTC ISO 8601，精确到毫秒
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - access
      properties:
        access:
          type: string
          enum:
            - owner
            - signed-out
            - reauth-required
            - not-owner
          description: 当前浏览器的统一账号状态
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - username
            - displayName
            - timezone
            - weekStartsOn
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
              minLength: 3
              maxLength: 20
            displayName:
              type: string
              minLength: 1
              maxLength: 24
            timezone:
              type: string
              description: IANA 时区，例如 Asia/Shanghai
            weekStartsOn:
              type: integer
              minimum: 0
              maximum: 6
              description: 一周从哪天开始：0=周日，1=周一 … 6=周六
            createdAt:
              type: string
              format: date-time
              description: Instant：UTC ISO 8601，精确到毫秒
          nullable: true
    Settings:
      type: object
      additionalProperties: false
      required:
        - displayName
        - timezone
        - weekStartsOn
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 24
        timezone:
          type: string
          description: IANA 时区；改时区只影响「今天」怎么算，已记录的日期不会被重算
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
    SettingsPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 24
        timezone:
          type: string
          description: 必须是 Intl.supportedValuesOf("timeZone") 里的值，否则 400 INVALID_TIMEZONE
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
      minProperties: 1
    CaptureSnapshot:
      type: object
      additionalProperties: false
      required:
        - title
        - narrative
        - agentSummary
        - happenedAt
        - happenedOn
        - happenedAtPrecision
        - scene
        - emotions
        - intensity
        - severity
        - fearedOutcome
        - outcomeKnownBy
        - thoughts
        - bodySignals
        - immediateResponse
        - people
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
        narrative:
          type: string
          minLength: 1
          maxLength: 20000
          description: 用户原话，原样保存
        agentSummary:
          type: string
          minLength: 1
          maxLength: 500
          description: Agent 的概括
          nullable: true
        happenedAt:
          type: string
          format: date-time
          description: 发生时间。precision 为 day/approx 时是所有者时区当天 12:00 对应的 UTC 时刻，只用于排序
        happenedOn:
          type: string
          format: date
          description: 发生日期（所有者时区），日历和统计按它分组
        happenedAtPrecision:
          $ref: "#/components/schemas/HappenedAtPrecision"
        scene:
          $ref: "#/components/schemas/Scene"
        emotions:
          type: array
          items:
            $ref: "#/components/schemas/EmotionScore"
          maxItems: 5
          minItems: 1
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: 当时有多难受，0–10
        severity:
          type: integer
          minimum: 0
          maximum: 10
          description: 当时觉得这件事有多严重，0–10；没评分为 null
          nullable: true
        fearedOutcome:
          type: string
          minLength: 1
          maxLength: 1000
          description: 当时担心会发生什么
          nullable: true
        outcomeKnownBy:
          type: string
          format: date
          description: 什么时候能知道担心的事有没有发生；第一次回看会排在这天之后
          nullable: true
        thoughts:
          type: string
          minLength: 1
          maxLength: 2000
          description: 当时脑子里冒出来的想法
          nullable: true
        bodySignals:
          type: string
          minLength: 1
          maxLength: 500
          description: 身体反应，例如脸红、心跳快
          nullable: true
        immediateResponse:
          type: string
          minLength: 1
          maxLength: 1000
          description: 当下是怎么应对的
          nullable: true
        people:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
          maxItems: 10
          description: 涉及的人，只写角色（如「新领导」），不写真名
    MomentSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - happenedAt
        - happenedOn
        - happenedAtPrecision
        - capturedAt
        - scene
        - emotions
        - intensity
        - severity
        - latestIntensityNow
        - latestResolution
        - status
        - nextReviewOn
        - tags
        - noteCount
        - reflectionCount
        - lessonCount
        - hasFear
        - source
        - excerpt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 60
        happenedAt:
          type: string
          format: date-time
          description: 发生时间。precision 为 day/approx 时是所有者时区当天 12:00 对应的 UTC 时刻，只用于排序
        happenedOn:
          type: string
          format: date
          description: 发生日期（所有者时区），日历和统计按它分组
        happenedAtPrecision:
          $ref: "#/components/schemas/HappenedAtPrecision"
        capturedAt:
          type: string
          format: date-time
          description: 记录时间（服务器时间），也是冻结期和复盘排程的锚点
        scene:
          $ref: "#/components/schemas/Scene"
        emotions:
          type: array
          items:
            $ref: "#/components/schemas/EmotionScore"
          maxItems: 5
          minItems: 1
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: 当时有多难受，0–10
        severity:
          type: integer
          minimum: 0
          maximum: 10
          description: 当时觉得这件事有多严重，0–10；没评分为 null
          nullable: true
        latestIntensityNow:
          type: integer
          minimum: 0
          maximum: 10
          description: 最近一次复盘时的强度；没有复盘为 null
          nullable: true
        latestResolution:
          type: string
          enum:
            - let_go
            - easing
            - still_matters
            - null
          description: 最近一次复盘的结论。let_go=放下了；easing=好多了；still_matters=还在意
          nullable: true
        status:
          description: 由后端推导，前端只展示
          allOf:
            - $ref: "#/components/schemas/MomentStatus"
        nextReviewOn:
          type: string
          format: date
          description: 下次该回看的日期；不再提醒时为 null
          nullable: true
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        noteCount:
          type: integer
          minimum: 0
          maximum: 1000000000
        reflectionCount:
          type: integer
          minimum: 0
          maximum: 1000000000
        lessonCount:
          type: integer
          minimum: 0
          maximum: 1000000000
        hasFear:
          type: boolean
          description: 当时是否写了担心的后果（fearedOutcome 不为空）
        source:
          $ref: "#/components/schemas/Actor"
        excerpt:
          type: string
          minLength: 0
          maxLength: 120
          description: 正文开头最多 120 个字
        matchSnippet:
          type: string
          minLength: 0
          maxLength: 200
          description: 只在带 q 搜索时出现：命中位置附近的片段
    MomentPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MomentSummary"
          maxItems: 100
        nextCursor:
          type: string
          minLength: 1
          maxLength: 200
          description: 下一页的游标；没有更多时为 null
          nullable: true
        total:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: 符合筛选条件的总数
    IntensityPoint:
      type: object
      additionalProperties: false
      required:
        - on
        - dayOffset
        - intensity
        - kind
        - reflectionId
      properties:
        on:
          type: string
          format: date
          description: 这个点的日期
        dayOffset:
          type: integer
          minimum: 0
          maximum: 100000
          description: 距离 happenedOn 的天数
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: 0–10 分
        kind:
          type: string
          enum:
            - capture
            - reflection
          description: capture=当时，reflection=某次复盘
        reflectionId:
          type: string
          format: uuid
          nullable: true
    LessonRef:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
    MomentDetail:
