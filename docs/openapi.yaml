# NBD 网页 API 契约草案（OpenAPI 3.0.3）：先于实现编写，P2 之后以服务端生成的 /openapi.json 为准
openapi: 3.0.3
info:
  title: NBD（没什么大不了）网页 API
  version: 1.0.0-draft
  description: |-
    给网页前端用的 REST 契约草案 v1，先于实现编写。后端完成 P2 阶段后，以服务端生成的 `/openapi.json` 为准，本文件退役。

    - 业务前缀 `/api/v1`，JSON 字段 camelCase。
    - 两种时间类型：**Instant**（`format: date-time`，UTC ISO 8601）和 **LocalDate**（`format: date`，`YYYY-MM-DD`，按所有者时区解释）。
    - 鉴权用 HttpOnly 会话 Cookie；fetch 设置 `credentials: "include"`。
    - 所有写请求必须带请求头 `X-NBD-Request: 1`。
    - 错误统一为 `{"error":{"code","message","details?"},"requestId"}`，每个操作可能的错误码见扩展字段 `x-nbd-error-codes`。
    - 新记录只由 Agent 通过 MCP 创建，网页没有新建事件的接口；MCP 契约见 `docs/MCP.md` 与 `docs/mcp-tools.json`。

    完整说明见 `docs/API.md`。
servers:
  - url: https://nbd.dkz12345.com
    description: 生产
  - url: http://127.0.0.1:3230
    description: 本地开发（COOKIE_SECURE=false，Cookie 名为 nbd_sid）
tags:
  - name: system
    description: 系统：健康检查、元数据
  - name: auth
    description: 账号与会话
  - name: moments
    description: 事件（一件事）：时间线、详情、修改、补记、标签、归档、回收站
  - name: reviews
    description: 复盘：待回看收件箱、写复盘
  - name: lessons
    description: 经验库
  - name: tags
    description: 标签管理
  - name: insights
    description: 洞察统计
  - name: access
    description: 接入管理：Agent 密钥、已连接的应用
  - name: data
    description: 设置、导出、操作记录
