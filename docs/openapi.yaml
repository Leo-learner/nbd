        - happenedOn
        - happenedAtPrecision
        - capturedAt
        - scene
        - emotions
        - intensity
        - severity
        - latestIntensityNow
        - latestResolution
        - status
        - nextReviewOn
        - hasFear
        - source
        - narrative
        - agentSummary
        - fearedOutcome
        - outcomeKnownBy
        - thoughts
        - bodySignals
        - immediateResponse
        - people
        - tags
        - noteCount
        - reflectionCount
        - lessonCount
        - revision
        - revisionCount
        - editableUntil
        - lastEditedAt
        - lastEditedBy
        - snoozedUntil
        - reviewStep
        - archivedAt
        - deletedAt
        - purgeAt
        - notes
        - reflections
        - lessons
        - intensitySeries
        - webUrl
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 60
        happenedAt:
          type: string
          format: date-time
          description: 发生时间。precision 为 day/approx 时是所有者时区当天 12:00 对应的 UTC 时刻，只用于排序
        happenedOn:
          type: string
          format: date
          description: 发生日期（所有者时区），日历和统计按它分组
        happenedAtPrecision:
          $ref: "#/components/schemas/HappenedAtPrecision"
        capturedAt:
          type: string
