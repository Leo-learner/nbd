      required:
        - range
        - minSample
        - totals
        - fear
        - intensity
        - letGo
        - distributions
      properties:
        range:
          $ref: "#/components/schemas/DateRange"
        minSample:
          type: integer
          minimum: 1
          maximum: 100
          description: 样本数低于它时前端显示「样本不足」，v1 为 5
        totals:
          type: object
          additionalProperties: false
          required:
            - moments
            - reflected
            - settled
            - archived
          properties:
            moments:
              type: integer
              minimum: 0
              maximum: 1000000000
            reflected:
              type: integer
              minimum: 0
              maximum: 1000000000
              description: 至少复盘过一次
            settled:
              type: integer
              minimum: 0
              maximum: 1000000000
            archived:
              type: integer
              minimum: 0
              maximum: 1000000000
        fear:
          type: object
          additionalProperties: false
          required:
            - withFear
            - judged
            - no
            - partly
            - yes
            - unknown
            - pending
            - neverHappenedRate
          properties:
            withFear:
              type: integer
              minimum: 0
              maximum: 1000000000
              description: 写了 fearedOutcome 的事件数
            judged:
              type: integer
              minimum: 0
              maximum: 1000000000
              description: no + partly + yes
            no:
              type: integer
              minimum: 0
              maximum: 1000000000
            partly:
              type: integer
              minimum: 0
              maximum: 1000000000
            yes:
              type: integer
              minimum: 0
              maximum: 1000000000
            unknown:
              type: integer
              minimum: 0
              maximum: 1000000000
              description: 复盘过但都答「还不知道」
            pending:
              type: integer
              minimum: 0
              maximum: 1000000000
              description: 还没复盘
            neverHappenedRate:
              type: number
              minimum: 0
              maximum: 1
              description: no ÷ judged；judged 为 0 时为 null。每件事取最近一次不是 unknown 的回答
              nullable: true
        intensity:
          type: object
          additionalProperties: false
          required:
